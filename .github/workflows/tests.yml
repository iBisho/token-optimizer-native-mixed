name: Tests

# The Python suite in tests/ on Linux and Windows, at the oldest and newest
# supported interpreters. Hooks run under whatever python3 a user has, so the
# floor (3.9) is tested, not assumed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.14"]
        shard: [1, 2, 3, 4]
        exclude:
          - os: windows-latest
            python-version: "3.9"
        include:
          - os: windows-latest
            python-version: "3.11"
            shard: 1
          - os: windows-latest
            python-version: "3.11"
            shard: 2
          - os: windows-latest
            python-version: "3.11"
            shard: 3
          - os: windows-latest
            python-version: "3.11"
            shard: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        env:
          TO_TEST_SHARD: ${{ matrix.shard }}/4
        run: python -m pytest tests/ -q -rs --ignore-glob='tests/test_measure_split_lane*.py'

  # Runtime proof of the hook non-blocking invariant on a machine with no
  # Python: the launcher must exit 0 (degrade, never block).
  no-python-hook-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The launcher exits 0 with no Python present
        run: |
          docker run --rm -v "$PWD":/w -w /w bash:5 bash -euc '
            if command -v python3 >/dev/null 2>&1; then echo "python3 unexpectedly present; test invalid"; exit 1; fi
            L=hooks/python-launcher.sh
            bash "$L" hooks/run.py skills/token-optimizer/scripts/read_cache.py --quiet
            TOKEN_OPTIMIZER_PYTHON=/bin/sh bash "$L" hooks/run.py skills/token-optimizer/scripts/read_cache.py --quiet
            bash "$L" hooks/run.py skills/token-optimizer/scripts/read_cache.py --quiet 2>&-
            echo "PASS"
          '

  desktop-mod-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/token-optimizer-desktop/package-lock.json
      - run: npm ci --ignore-scripts --prefix desktop/token-optimizer-desktop
      - run: npm run typecheck --prefix desktop/token-optimizer-desktop
      - run: npm test --prefix desktop/token-optimizer-desktop
