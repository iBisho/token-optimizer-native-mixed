name: Refresh model prices

# Once a day, rebuild skills/token-optimizer/pricing/prices.json from
# Anthropic's pricing page and the LiteLLM price feed. When prices changed,
# run the tests and open (or update) one review PR. Nothing is released
# automatically. The plugin only reads the bundled file: no runtime network.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild the price table
        id: refresh
        run: |
          set +e
          python3 scripts/refresh_prices.py --summary "$RUNNER_TEMP/prices-summary.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0)  echo "No price changes." ;;
            10|3) echo "Prices changed." ;;
            *)  echo "::error::refresh_prices.py failed ($code); nothing written."; exit "$code" ;;
          esac

      - name: Run the tests
        id: tests
        if: steps.refresh.outputs.code != '0'
        continue-on-error: true
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Open a review PR
        if: steps.refresh.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="prices/refresh-review"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "chore(prices): refresh model prices"
          git push --force origin "$BRANCH"
          {
            echo "The daily price refresh found changes."
            echo
            if [ "${{ steps.tests.outcome }}" != "success" ]; then
              echo "**Tests failed with the new prices.** Check the workflow run log."
              echo
            fi
            cat "$RUNNER_TEMP/prices-summary.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr view "$BRANCH" >/dev/null 2>&1 \
            || gh pr create --base main --head "$BRANCH" \
                 --title "Refresh model prices" \
                 --body-file "$RUNNER_TEMP/pr-body.md"
